  <polyline points="220,225 300,90 400,90 500,90 600,90" fill="none" stroke="#333333" stroke-width="3"/>
  <!-- P2: 破線 -->
  <polyline points="220,225 300,160 400,160 500,160 600,160" fill="none" stroke="#333333" stroke-width="3" stroke-dasharray="10,6"/>
