  </g>
  <g stroke="#333333" stroke-width="2" fill="#ffffff">
    <circle cx="100" cy="225" r="16"/>
    <circle cx="160" cy="225" r="16"/>
    <circle cx="220" cy="225" r="16"/>
    <circle cx="280" cy="225" r="16"/>
    <circle cx="340" cy="225" r="16"/>
    <circle cx="400" cy="225" r="16"/>
    <circle cx="460" cy="225" r="16"/>
    <circle cx="520" cy="225" r="16"/>
    <circle cx="580" cy="225" r="16"/>
    <circle cx="640" cy="225" r="16"/>
    <circle cx="700" cy="225" r="16"/>
    <circle cx="730" cy="225" r="10"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">
    <text x="100" y="230">1</text>
    <text x="160" y="230">2</text>
    <text x="220" y="230">3</text>
    <text x="280" y="230">4</text>
    <text x="340" y="230">5</text>
    <text x="400" y="230">6</text>
    <text x="460" y="230">7</text>
    <text x="520" y="230">8</text>
    <text x="580" y="230">9</text>
    <text x="640" y="230">10</text>
    <text x="700" y="230">11</text>
  </g>

  <!-- 4本の支線: 線種で区別（色のみに依存しない） -->
  <line x1="100" y1="120" x2="100" y2="209" stroke="#333333" stroke-width="2" stroke-dasharray="none"/>
  <line x1="220" y1="120" x2="220" y2="209" stroke="#333333" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="340" y1="330" x2="340" y2="241" stroke="#333333" stroke-width="2" stroke-dasharray="2,4"/>
  <line x1="460" y1="330" x2="460" y2="241" stroke="#333333" stroke-width="2" stroke-dasharray="10,4,2,4"/>

  <g font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">
    <text x="100" y="110">P1 Java/C#（実線）</text>
    <text x="220" y="110">P2 JS/TS（破線）</text>
