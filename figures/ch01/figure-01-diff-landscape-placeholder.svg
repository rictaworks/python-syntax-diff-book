<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img"
     aria-label="図1-1プレースホルダー：他言語出身者の躓きポイント地図（本番はAI生成画像に差し替え予定）">
  <title>図1-1プレースホルダー（本番画像未生成）</title>
