<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img"
     aria-label="図2-3プレースホルダー：isと==の違い（本番はAI生成画像に差し替え予定）">
  <title>図2-3プレースホルダー（本番画像未生成）</title>
  <desc>
    figure-03-is-vs-equality-spec.md の仕様に基づき、AI生成画像に差し替えるまでの
    仮画像。パネルA（==：別々の箱でも中身が等しい）とパネルB（is：同じ箱か
    どうか）を上下に並べ、下部にCPythonの小さいintキャッシュの注記枠を破線で示す。
  </desc>

  <rect x="4" y="4" width="792" height="442" fill="#ffffff" stroke="#333333" stroke-width="3"/>

  <!-- パネルA: == -->
  <text x="400" y="60" font-family="sans-serif" font-size="16" fill="#333333" text-anchor="middle">パネルA：== （値の等価性）</text>
  <rect x="150" y="80" width="90" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="195" y="115" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333">left</text>
  <rect x="560" y="80" width="90" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="605" y="115" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#333333">right</text>
  <line x1="240" y1="110" x2="560" y2="110" stroke="#333333" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="102" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333333">== → True（別々の箱、中身は等しい）</text>

  <line x1="20" y1="165" x2="780" y2="165" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- パネルB: is -->
  <text x="400" y="195" font-family="sans-serif" font-size="16" fill="#333333" text-anchor="middle">パネルB：is （同一性）</text>

  <!-- ケース1: 同じ箱 -->
  <text x="180" y="215" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">ケース1：同じ箱</text>
  <rect x="130" y="225" width="100" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="4"/>
  <rect x="126" y="221" width="108" height="68" rx="10" fill="none" stroke="#333333" stroke-width="1"/>
  <line x1="100" y1="200" x2="160" y2="225" stroke="#333333" stroke-width="2"/>
  <line x1="260" y1="200" x2="200" y2="225" stroke="#333333" stroke-width="2"/>
  <text x="100" y="195" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333333">a</text>
  <text x="260" y="195" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333333">b</text>
  <text x="180" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">is → True（二重線＝同じ箱）</text>

  <!-- ケース2: 別々の箱 -->
  <text x="600" y="215" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">ケース2：別々の箱</text>
  <rect x="520" y="225" width="80" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <rect x="640" y="225" width="80" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="560" y1="225" x2="560" y2="205" stroke="#333333" stroke-width="2"/>
  <line x1="680" y1="225" x2="680" y2="205" stroke="#333333" stroke-width="2"/>
  <text x="620" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">is → False（単線＝別の箱）</text>

  <!-- 注記：小さいintキャッシュ -->
  <rect x="130" y="345" width="540" height="70" fill="#ffffff" stroke="#333333" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="400" y="368" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">注記（実装詳細）：CPythonは-5〜256の整数をキャッシュするため、</text>
  <text x="400" y="386" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">独立して生成してもisがTrueになることがある（言語仕様ではない）</text>

  <text x="400" y="30" font-family="sans-serif" font-size="20" fill="#333333" text-anchor="middle">
    PLACEHOLDER — 図2-3（本番はAI生成画像に差し替え予定）
  </text>
  <text x="400" y="435" font-family="sans-serif" font-size="13" fill="#666666" text-anchor="middle">
    詳細仕様: figures/ch02/figure-03-is-vs-equality-spec.md
  </text>
</svg>
