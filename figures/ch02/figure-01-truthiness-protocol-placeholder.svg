<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img"
     aria-label="図2-1プレースホルダー：真偽判定プロトコルの判定フロー（本番はAI生成画像に差し替え予定）">
  <title>図2-1プレースホルダー（本番画像未生成）</title>
  <desc>
    figure-01-truthiness-protocol-spec.md の仕様に基づき、AI生成画像に差し替えるまでの
    仮画像。__bool__ → __len__ → 常にTrue、という3段階の判定フローチャート。
    Yes分岐は実線、No分岐は破線で区別し、色には依存しない。
  </desc>

  <rect x="4" y="4" width="792" height="442" fill="#ffffff" stroke="#333333" stroke-width="3"/>

  <!-- 開始 -->
  <rect x="330" y="50" width="140" height="34" rx="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="400" y="72" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">if obj: を評価</text>

  <!-- 判定1 -->
  <polygon points="400,100 480,140 400,180 320,140" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="400" y="135" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333333">__bool__</text>
  <text x="400" y="150" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333333">定義済み？</text>

  <!-- Yes -> 終了A -->
  <line x1="480" y1="140" x2="620" y2="140" stroke="#333333" stroke-width="2"/>
  <text x="540" y="132" font-family="sans-serif" font-size="12" fill="#333333">Yes</text>
  <rect x="620" y="122" width="150" height="36" rx="18" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <text x="695" y="145" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333333">戻り値を採用</text>

  <!-- No -> 判定2 -->
  <line x1="400" y1="180" x2="400" y2="220" stroke="#333333" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="415" y="203" font-family="sans-serif" font-size="12" fill="#333333">No</text>

  <polygon points="400,220 480,260 400,300 320,260" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="400" y="255" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333333">__len__</text>
  <text x="400" y="270" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333333">定義済み？</text>

  <!-- No -> 常にTrue -->
  <line x1="320" y1="260" x2="150" y2="260" stroke="#333333" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="235" y="252" font-family="sans-serif" font-size="12" fill="#333333">No</text>
  <rect x="30" y="242" width="120" height="36" rx="18" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <text x="90" y="265" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333333">常に True</text>

  <!-- Yes -> 判定3 -->
  <line x1="400" y1="300" x2="400" y2="340" stroke="#333333" stroke-width="2"/>
  <text x="415" y="323" font-family="sans-serif" font-size="12" fill="#333333">Yes</text>

  <polygon points="400,340 490,375 400,410 310,375" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="400" y="371" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#333333">len(obj)==0?</text>

  <!-- Yes -> False -->
  <line x1="490" y1="375" x2="620" y2="375" stroke="#333333" stroke-width="2"/>
  <text x="545" y="367" font-family="sans-serif" font-size="12" fill="#333333">Yes</text>
  <rect x="620" y="357" width="100" height="36" rx="18" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <text x="670" y="380" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">False</text>

  <!-- No -> True -->
  <line x1="310" y1="375" x2="200" y2="375" stroke="#333333" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="255" y="367" font-family="sans-serif" font-size="12" fill="#333333">No</text>
  <rect x="80" y="357" width="100" height="36" rx="18" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <text x="130" y="380" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">True</text>

  <text x="400" y="30" font-family="sans-serif" font-size="20" fill="#333333" text-anchor="middle">
    PLACEHOLDER — 図2-1（本番はAI生成画像に差し替え予定）
  </text>
  <text x="400" y="435" font-family="sans-serif" font-size="13" fill="#666666" text-anchor="middle">
    詳細仕様: figures/ch02/figure-01-truthiness-protocol-spec.md
  </text>
</svg>
