name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify-code-listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest ruff

      - name: Lint code listings
        run: ruff check .

      - name: Run code listing tests
        run: |
          if find . -path ./node_modules -prune -o -name "test_*.py" -print -quit | grep -q .; then
            pytest
          else
            echo "コードリストのテストがまだ存在しません（原稿未着手のためスキップ）"
          fi

      - name: Validate EPUB build (if build script exists)
        run: |
          if [ -x "build/epub.sh" ]; then
            build/epub.sh
          else
            echo "EPUBビルドスクリプトが未整備のためスキップ（ENV/DEVELOPMENT.md参照）"
          fi
